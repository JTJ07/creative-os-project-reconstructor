name: Verify Project Reconstructor

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify repository contract
        run: python scripts/verify_reconstructor.py

      - name: Run validator security regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
